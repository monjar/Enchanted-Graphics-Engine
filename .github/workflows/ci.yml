name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run --Werror \
            $(git ls-files 'src/*.cpp' 'src/*.hpp' 'app/*.cpp' 'tests/*.cpp')

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Release
            os: ubuntu-24.04
            preset: default
          - name: Linux / Debug
            os: ubuntu-24.04
            preset: debug
          - name: Linux / ASan + UBSan
            os: ubuntu-24.04
            preset: asan
          - name: Linux / ThreadSanitizer
            os: ubuntu-24.04
            preset: tsan
          - name: Linux / C++20
            os: ubuntu-24.04
            preset: cxx20
          - name: Windows / Release
            os: windows-2022
            preset: default

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            mesa-vulkan-drivers xorg-dev libwayland-dev libxkbcommon-dev \
            xvfb

      # Pinned, not latest: every dependency this project builds against is
      # pinned, and the SDK was the one thing left floating. It broke exactly
      # the way floating versions do - a new SDK release changed the layout
      # the action extracts, find_package(Vulkan) stopped finding the library
      # and headers, and the Windows job went red on a commit that changed
      # nothing about Windows or Vulkan.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.304.1
          cache: true

      # The action extracts the SDK tree but does not install the loader into
      # System32 the way the real installer would, and the runner has no GPU
      # driver to provide one either. Everything that links vulkan-1.lib -
      # including the test runner, which never calls Vulkan but still imports
      # the DLL - dies at process start with STATUS_DLL_NOT_FOUND unless the
      # loader is findable, so the copy the SDK ships is put on PATH.
      - name: Put the Vulkan loader on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll |
            Where-Object { $_.FullName -notmatch '32' } | Select-Object -First 1
          if (-not $dll) {
            Write-Error "no vulkan-1.dll anywhere in the extracted SDK"
            exit 1
          }
          Write-Host "loader: $($dll.FullName)"
          Add-Content $env:GITHUB_PATH $dll.DirectoryName

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        working-directory: build/${{ matrix.preset }}
        run: ctest --output-on-failure

      # Renders the demo scene under lavapipe with the validation layers on and
      # fails on any validation message. This is what catches Vulkan misuse that
      # happens to work on one driver but is not actually legal.
      - name: Headless render smoke test
        if: runner.os == 'Linux' && matrix.preset != 'tsan'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a --server-args="-screen 0 800x600x24" \
            ./scripts/run_for.sh 8 ./build/${{ matrix.preset }}/bin/EnchantedEngine \
            2>&1 | tee render.log

          if grep -qiE "validation layer:.*(Error|Warning)" render.log; then
            echo "::error::Vulkan validation layer reported a problem"
            grep -iE "validation layer:" render.log
            exit 1
          fi
          echo "Rendered with no validation messages."

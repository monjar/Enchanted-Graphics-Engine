name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run --Werror \
            $(git ls-files 'src/*.cpp' 'src/*.hpp' 'app/*.cpp' 'tests/*.cpp' \
                           'sandbox/*.cpp' 'sandbox/*.hpp')

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Release
            os: ubuntu-24.04
            preset: default
          - name: Linux / Debug
            os: ubuntu-24.04
            preset: debug
          - name: Linux / ASan + UBSan
            os: ubuntu-24.04
            preset: asan
          - name: Linux / ThreadSanitizer
            os: ubuntu-24.04
            preset: tsan
          - name: Linux / C++20
            os: ubuntu-24.04
            preset: cxx20
          - name: Windows / Release
            os: windows-2022
            preset: default

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            mesa-vulkan-drivers xorg-dev libwayland-dev libxkbcommon-dev \
            xvfb

      # Pinned, not latest: every dependency this project builds against is
      # pinned, and the SDK was the one thing left floating. It broke exactly
      # the way floating versions do - a new SDK release changed the layout
      # the action extracts, find_package(Vulkan) stopped finding the library
      # and headers, and the Windows job went red on a commit that changed
      # nothing about Windows or Vulkan.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.304.1
          cache: true

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        working-directory: build/${{ matrix.preset }}
        run: ctest --output-on-failure

      # Renders the demo scene under lavapipe with the validation layers on and
      # fails on any validation message. This is what catches Vulkan misuse that
      # happens to work on one driver but is not actually legal.
      - name: Headless render smoke test
        if: runner.os == 'Linux' && matrix.preset != 'tsan'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          # Recording as it goes, so there is something to look at afterwards.
          # The demo tour is deterministic while recording - a fixed step per
          # frame - so the frames are the same on any machine fast or slow.
          mkdir -p frames
          timeout 180 xvfb-run -a --server-args="-screen 0 800x600x24" \
            ./build/${{ matrix.preset }}/bin/EnchantedEngine --demo \
            --exit-after 6 --record frames --record-fps 5 \
            2>&1 | tee render.log

          # Two formats, because there are two ways a message arrives. The
          # engine installs a debug messenger and logs "validation layer: ..."
          # - but only in Debug, where the validation layers are switched on by
          # the build. In Release the loader still enables the layer through
          # the environment above and the layer prints in its own format,
          # which the first pattern alone does not match at all: a Release
          # smoke test was checking nothing.
          if grep -qiE "validation layer:.*(error|warning)|validation (error|warning)" render.log; then
            echo "::error::Vulkan validation layer reported a problem"
            grep -iE "validation layer:|validation (error|warning)" render.log | head -40
            exit 1
          fi
          echo "Rendered with no validation messages."

          # And then look at the picture. Everything above passes on a
          # uniformly black frame: the engine starts, renders, does not crash
          # and upsets no validation layer whether or not anything came out.
          # This is the check that noticed when the scene pass was emptied on
          # purpose, and it was the only one that did.
          ./build/${{ matrix.preset }}/bin/EnchantedFrameChecks frames
